name: Feedback routine
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Lấy phản hồi đã commit từ các repo trong registry
        run: |
          set -euo pipefail
          python3 scripts/xt.py registry > /dev/null
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"], "feedback-sources")
          for product in json.loads(Path("docs/ops/registry.json").read_text())["products"]:
              repo = product["repo"]
              dest = root / repo
              subprocess.run(["git", "clone", "--filter=blob:none", "--no-tags", "--single-branch", "--sparse",
                              f"https://github.com/{repo}.git", str(dest)], check=True)
              subprocess.run(["git", "-C", str(dest), "sparse-checkout", "set", "docs/xtemplates-feedback"], check=True)
          PY
      - name: Kiểm PR báo cáo khi có phản hồi mới
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/xt.py feedback routine-check --from "$RUNNER_TEMP/feedback-sources" --days 8
